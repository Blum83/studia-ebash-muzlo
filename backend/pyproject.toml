[project]
name = "songgen"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ace-step",
    "anthropic>=0.70",
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[project.scripts]
songgen = "app.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Lock only for the two targets we run on: this Windows box and Linux GPU boxes / Docker.
[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# uv ignores a path dependency's own [tool.uv.sources], so ACE-Step's are mirrored here.
[tool.uv.sources]
ace-step = { path = "../third_party/ACE-Step-1.5", editable = true }
nano-vllm = { path = "../third_party/ACE-Step-1.5/acestep/third_parts/nano-vllm" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
